<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reef Perf — Kernel performance explorer</title>
<meta name="description" content="Per-block bottleneck estimates for transformer models on the Reef (Coral VME) NPU, from RTL-simulated kernel cycles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='6' fill='%2315181d'/%3E%3Crect x='7' y='7' width='14' height='14' rx='2' fill='none' stroke='%23e8eaed' stroke-width='1.6'/%3E%3Crect x='11' y='11' width='6' height='6' fill='%23f5c26b'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=panel16">
</head>
<body>
<div class="app">
  <header class="nav">
    <div class="field">
      <label for="model-select">Model</label>
      <select id="model-select"></select>
    </div>
    <div class="field">
      <label for="hw-select">Hardware</label>
      <select id="hw-select"></select>
    </div>
    <div class="field">
      <label for="res-select">Kernel results</label>
      <select id="res-select"></select>
    </div>
    <button type="button" id="whatif-btn" class="btn" aria-pressed="false">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h7M13 4h1M2 12h1M7 12h7M11 2v4M5 10v4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      What-if <span id="whatif-count" class="pill" hidden></span>
    </button>
    <div class="spacer"></div>
    <div id="phase-seg" class="seg" role="group" aria-label="Phase"></div>
    <div class="field">
      <span id="seq-label" class="muted small">Context</span>
      <div id="seq-seg" class="seg" role="group" aria-label="Sequence length"></div>
    </div>
    <input type="file" id="model-file" accept=".json,application/json" hidden>
    <input type="file" id="hw-file" accept=".json,application/json" hidden>
  </header>

  <div class="stage">
    <div id="scroller" class="scroller">
      <div id="sizer" class="sizer"><div id="world" class="world"></div></div>
    </div>
    <div id="context-label" class="context-label"></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <div class="dock">
      <div class="seg" role="group" aria-label="Zoom">
        <button type="button" class="icon-btn" data-zoom="-1" aria-label="Zoom out">−</button>
        <button type="button" class="zoom-pct" data-zoom="fit" id="zoom-pct">100%</button>
        <button type="button" class="icon-btn" data-zoom="1" aria-label="Zoom in">+</button>
      </div>
      <div id="legend" class="legend"></div>
    </div>
    <section id="whatif" class="popup whatif" aria-label="What-if parameters" hidden></section>
    <div id="right" class="right"></div>
  </div>
</div>
<script src="app.js?v=panel16"></script>
</body>
</html>
